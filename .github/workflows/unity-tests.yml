name: Unity CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Allows GameCI to post test summaries directly to your PR

    steps:
      # 1. Pull down your repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Essential if you use Git LFS for heavy assets

      # 2. Restore/Save the Library cache to stop Unity from re-importing assets on every run
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Execute Unity tests using clean Personal Account parameters
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Forces Unity 6 to write its local licensing sockets safely inside your open repository workspace
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        with:
          unityVersion: 6000.5.7f1
          testMode: editmode
          coverageEnabled: true
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear'
          artifactsPath: artifacts
          # Removed runAsHostUser so Docker doesn't mask the account user profile UPDATED: Caused 3 minute hang
          runAsHostUser: true
          # REMOVED runAsHostUser, useHostNetwork, and absolute host paths
                    # FORCES INTERNAL NETWORK SUB-SYSTEMS TO TIMEOUT IN SECONDS INSTEAD OF MINUTES
          customParameters: >-
            -batchmode
            -nographics
            -disable-assembly-updater
            -localCacheServerRootDir "./.cache"
            --override "clientConnectTimeoutSec=5"
            --override "clientHandshakeTimeoutSec=5"
            --override "clientUpdateLicenseTimeoutSec=5"
            --override "clientResolveEntitlementsTimeoutSec=5"
