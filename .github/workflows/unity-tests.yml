name: Unity CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Needed if Game-CI posts test summaries to your PR

    steps:
      # 1. Pull down the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Crucial if you use Git LFS for heavy assets

      # 2. Restore/Save the Library cache to skip re-importing assets
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Execute the tests using fixed configuration inputs
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # Make sure this secret is set in your repo settings
        with:
          unityVersion: 6000.5.7f1
          testMode: editmode
          coverageEnabled: true
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear'
          artifactsPath: artifacts
