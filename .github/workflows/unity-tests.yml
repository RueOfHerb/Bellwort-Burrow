name: Unity Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # Grants the job permission to report the test metrics back to the GitHub PR/Check UI
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 6000.5.7f1
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Explicitly ensure Git LFS assets are decompressed and pulled
      - name: Checkout LFS objects
        run: git lfs pull

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          testMode: editmode
          githubToken: ${{ github.token }} # Links the write token permission into the runner action
          
          # Crucial Fixes for Unity 6 Linux Docker Deadlocks:
          coverageEnabled: false      # Disables the Coverage engine which induces freezing in headless Unity 6
          useHostNetwork: true           # Unblocks local container port-loopbacks during license checking
