name: Unity CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Allows GameCI to post test summaries directly to your PR

    steps:
      # 1. Pull down your repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Essential if you use Git LFS for heavy assets

      # 2. Restore/Save the Library cache to stop Unity from re-importing assets on every run
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Execute Unity tests with correct Personal License credentials
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }} # Bypasses .ulf dependencies completely
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          testMode: editmode
          coverageEnabled: true
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear'
          artifactsPath: artifacts
